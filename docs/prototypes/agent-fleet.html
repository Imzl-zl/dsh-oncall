<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH On-call · Agent Fleet 设计原型</title>
<style>
/* =====================================================================
   DSH token 底座（取自 ui-theme/design-platform.css）
   ===================================================================== */
:root {
  --font-text: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', Consolas, 'Cascadia Mono', monospace;
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --dur: .18s; --ease: cubic-bezier(.4,0,.2,1);
  --app-w: 1440px; --left-w: 280px; --right-w: 648px;
  --page-w: 960px;
}
html[data-theme="light"] {
  --bg-base: #ffffff;
  --bg-layer-1: #ffffff;
  --bg-layer-2: #f9fafb;
  --bg-layer-3: #f1f3f5;
  --bg-overlay: #e9ecf2;
  --border-l1: rgba(0,0,0,.04);
  --border-l2: rgba(0,0,0,.10);
  --border-l3: rgba(0,0,0,.12);
  --border-l4: rgba(0,0,0,.16);
  --label-primary: #0f1115;
  --label-secondary: #61666b;
  --label-tertiary: #81858c;
  --label-caption: #adb2b8;
  --accent: #4A65E8;
  --accent-strong: #3B53C9;
  --accent-text: color-mix(in srgb, #4A65E8 80%, black);
  --accent-soft: rgba(74,101,232,.08);
  --accent-border: rgba(74,101,232,.24);
  --ok: #22c55e; --ok-text: #166534; --ok-soft: rgba(34,197,94,.10);
  --warn: #f59e0b; --warn-text: #92400e; --warn-soft: rgba(245,158,11,.12);
  --bad: #ef4444; --bad-text: #991b1b; --bad-soft: rgba(239,68,68,.10);
  --review: #61666b; --review-text: #3f4448; --review-soft: rgba(0,0,0,.04);
  --hover: rgba(0,0,0,.04);
  --selected: rgba(74,101,232,.07);
  --shadow-card: 0 1px 2px rgba(0,0,0,.04);
  --shadow-panel: -8px 0 28px rgba(0,0,0,.06);
  --canvas: #e8ebf0;
}
html[data-theme="dark"] {
  --bg-base: #151517;
  --bg-layer-1: #232324;
  --bg-layer-2: #1d1d1f;
  --bg-layer-3: #2c2c2e;
  --bg-overlay: #0f0f10;
  --border-l1: rgba(255,255,255,.06);
  --border-l2: rgba(255,255,255,.12);
  --border-l3: rgba(255,255,255,.16);
  --border-l4: rgba(255,255,255,.20);
  --label-primary: #f9fafb;
  --label-secondary: #cfd3d6;
  --label-tertiary: #adb2b8;
  --label-caption: #7f858c;
  --accent: #7a9bff;
  --accent-strong: #93a7ff;
  --accent-text: color-mix(in srgb, #7a9bff 72%, white);
  --accent-soft: rgba(122,155,255,.12);
  --accent-border: rgba(122,155,255,.26);
  --ok: #4ade80; --ok-text: #86efac; --ok-soft: rgba(74,222,128,.10);
  --warn: #fbbf24; --warn-text: #fcd34d; --warn-soft: rgba(251,191,36,.10);
  --bad: #f87171; --bad-text: #fca5a5; --bad-soft: rgba(248,113,113,.10);
  --review: #adb2b8; --review-text: #cfd3d6; --review-soft: rgba(255,255,255,.06);
  --hover: rgba(255,255,255,.06);
  --selected: rgba(122,155,255,.12);
  --shadow-card: 0 1px 2px rgba(0,0,0,.3);
  --shadow-panel: -8px 0 28px rgba(0,0,0,.35);
  --canvas: #0d0d0e;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--canvas);
  color: var(--label-primary); font-family: var(--font-text);
  font-size: 13px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { display: block; flex: none; }
.num, time, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- demo chrome ---------- */
.demobar {
  height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--bg-layer-1); border-bottom: .5px solid var(--border-l2);
  overflow-x: auto; white-space: nowrap; position: relative; z-index: 50;
}
.demo-brand { display: flex; align-items: center; gap: 8px; font-size: 12px; flex: none; }
.demo-logo {
  width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .02em;
}
.demo-brand b { font-size: 12.5px; font-weight: 600; }
.demo-ver { color: var(--label-tertiary); font-family: var(--font-mono); font-size: 10.5px; }
.demo-sep { width: 1px; height: 20px; background: var(--border-l2); flex: none; }
.demo-group { display: flex; align-items: center; gap: 3px; flex: none; }
.demo-label { color: var(--label-tertiary); font-size: 10.5px; margin-right: 2px; }
.demo-btn {
  height: 26px; padding: 0 8px; border: .5px solid transparent; background: transparent;
  border-radius: 6px; color: var(--label-secondary); font-size: 11.5px;
}
.demo-btn:hover { background: var(--hover); color: var(--label-primary); }
.demo-btn.is-active { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-border); }
.demo-spacer { flex: 1; min-width: 8px; }
.stage {
  height: calc(100vh - 46px); overflow: auto; padding: 14px; display: flex;
  justify-content: center; align-items: flex-start; background: var(--canvas);
}
.app {
  width: var(--app-w); height: calc(100vh - 74px); min-height: 620px;
  display: grid; grid-template-columns: var(--left-w) minmax(0,1fr) var(--right-w);
  background: var(--bg-base); border-radius: 10px; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,.14); border: .5px solid var(--border-l2);
  position: relative;
}
.app[data-screen="console"] { grid-template-columns: var(--left-w) minmax(0,1fr); }
.app[data-w="1440"] { --app-w: 1440px; --left-w: 280px; --right-w: 648px; }
.app[data-w="1280"] { --app-w: 1280px; --left-w: 280px; --right-w: 576px; }
.app[data-w="1024"] { --app-w: 1024px; --left-w: 280px; --right-w: 344px; }
.app[data-w="900"]  { --app-w: 900px;  --left-w: 56px; --right-w: 405px; }
.app[data-w="800"]  { --app-w: 800px;  --left-w: 56px; --right-w: 344px; }
.app[data-w="full"] { --app-w: 1440px; grid-template-columns: minmax(0,1fr); }
.app[data-w="full"] .leftrail,
.app[data-w="full"] .maincol { display: none; }
body.no-chrome .demobar { display: none; }
body.no-chrome .stage { display: block; height: calc(100vh - var(--legend-h, 0px)); padding: 0; }
body.no-chrome .app { width: 100%; height: calc(100vh - var(--legend-h, 0px)); border: 0; border-radius: 0; box-shadow: none; }

/* ---------- left rail ---------- */
.leftrail {
  min-height: 0; display: flex; flex-direction: column;
  background: var(--bg-layer-2); border-right: .5px solid var(--border-l1);
  overflow: hidden;
}
.rail-top { padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.rail-brand { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
.rail-brand .dotmark { width: 18px; height: 18px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 9px; font-weight: 700; }
.rail-brand small { margin-left: auto; font-size: 10px; color: var(--label-tertiary); font-weight: 400; }
.rail-new {
  height: 30px; border: .5px solid var(--border-l3); border-radius: var(--r-sm);
  background: var(--bg-layer-1); color: var(--label-primary); font-size: 12px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.rail-new:hover { background: var(--hover); }
.rail-search {
  height: 28px; border: .5px solid var(--border-l2); border-radius: var(--r-sm);
  background: var(--bg-layer-1); display: flex; align-items: center; gap: 6px;
  padding: 0 8px; color: var(--label-tertiary); font-size: 11.5px;
}
.rail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 8px; }
.rail-group { margin-top: 10px; }
.rail-group-head {
  display: flex; align-items: center; gap: 5px; padding: 3px 4px;
  color: var(--label-tertiary); font-size: 10.5px; letter-spacing: .02em;
}
.rail-group-head b { color: var(--label-secondary); font-weight: 500; font-size: 11px; }
.rail-group-head .count { margin-left: auto; font-variant-numeric: tabular-nums; }
.rail-row {
  display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 4px 6px;
  border-radius: 6px; color: var(--label-secondary); font-size: 11.5px;
}
.rail-row:hover { background: var(--hover); }
.rail-row.is-current { background: var(--selected); color: var(--label-primary); }
.rail-row .status-dot { width: 5px; height: 5px; }
.rail-row span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-foot { border-top: .5px solid var(--border-l1); padding: 8px 10px; display: flex; gap: 10px; color: var(--label-tertiary); font-size: 11px; }
.rail-mini { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; flex: 1; color: var(--label-tertiary); }
.rail-mini .mini-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; border: 0; background: transparent; color: inherit; }
.rail-mini .mini-btn.is-active { background: var(--selected); color: var(--accent-text); }
.app[data-w="900"] .leftrail .wide,
.app[data-w="800"] .leftrail .wide { display: none; }
.app[data-w="900"] .leftrail .rail-mini,
.app[data-w="800"] .leftrail .rail-mini { display: flex; }
.app[data-w="900"] .leftrail,
.app[data-w="800"] .leftrail { align-items: stretch; }

/* ---------- main column / conversation ---------- */
.maincol { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg-base); }
.conv-head {
  flex: none; display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 20px 10px; border-bottom: .5px solid var(--border-l1);
}
.conv-head-main { min-width: 0; flex: 1; }
.conv-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.conv-title-row h1 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 11px; color: var(--label-tertiary); }
.conv-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.conv-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 12px; }
.thread { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.msg { display: flex; flex-direction: column; gap: 6px; }
.msg-head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--label-tertiary); }
.msg-head b { font-weight: 550; color: var(--label-secondary); }
.msg-body { font-size: 13px; line-height: 1.75; color: var(--label-primary); }
.msg.user { align-items: flex-end; }
.msg.user .msg-body {
  background: var(--bg-layer-3); border-radius: 10px; padding: 8px 12px; max-width: 86%;
}
.msg.assistant .msg-body p { margin: 0 0 8px; }
.msg.assistant .msg-body p:last-child { margin-bottom: 0; }
.msg.assistant ul { margin: 4px 0 0; padding-left: 18px; color: var(--label-secondary); }
.msg.assistant li { margin: 3px 0; }
.event-card {
  border: .5px solid var(--border-l2); border-radius: 10px; background: var(--bg-layer-2);
  padding: 10px 12px; display: flex; flex-direction: column; gap: 7px;
}
.event-card .ec-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 550; }
.event-card .ec-meta { font-size: 11.5px; color: var(--label-tertiary); }
.agent-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.agent-chip {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px;
  border: .5px solid var(--border-l2); border-radius: 999px; background: var(--bg-layer-1);
  font-size: 10.5px; color: var(--label-secondary);
}
.composer {
  flex: none; margin: 8px 20px 16px; border: .5px solid var(--border-l3); border-radius: 12px;
  background: var(--bg-layer-1); padding: 8px 10px 7px; box-shadow: var(--shadow-card);
}
.composer .c-input { min-height: 34px; font-size: 12.5px; color: var(--label-tertiary); padding: 6px 2px; }
.composer .c-foot { display: flex; align-items: center; gap: 8px; }
.composer .c-foot .grow { flex: 1; }
.composer .c-chip { height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border: .5px solid var(--border-l2); border-radius: 6px; color: var(--label-secondary); font-size: 10.5px; background: transparent; }
.composer .c-chip:hover { background: var(--hover); }
.chip-popover {
  position: absolute; left: 10px; bottom: 54px; width: 266px; z-index: 30;
  background: var(--bg-base); border: .5px solid var(--border-l2); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 10px;
}
.chip-popover .pop-title { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; margin-bottom: 7px; }
.chip-popover .pop-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 10.5px; color: var(--label-secondary); }
.chip-popover .pop-row .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip-popover .pop-row .input { width: 58px; height: 26px; text-align: center; }
.chip-popover .hint { margin: 6px 0 0; }
.composer .c-send { width: 26px; height: 26px; border-radius: 7px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; }

/* ---------- generic bits ---------- */
.iconbtn {
  border: 0; background: transparent; color: var(--label-tertiary); width: 26px; height: 26px;
  border-radius: 6px; display: inline-grid; place-items: center; flex: none;
}
.iconbtn:hover { background: var(--hover); color: var(--label-primary); }
.iconbtn.is-active { background: var(--accent-soft); color: var(--accent-text); }
.btn {
  height: 28px; padding: 0 10px; border-radius: 7px; border: .5px solid var(--border-l3);
  background: var(--bg-layer-1); color: var(--label-primary); font-size: 11.5px;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--label-secondary); }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 11px; border-radius: 6px; }
.tag {
  display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px;
  border-radius: 4px; border: .5px solid var(--border-l2); background: transparent;
  color: var(--label-secondary); font-size: 10.5px; line-height: 16px; white-space: nowrap;
}
.tag.accent { color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent-border); }
.tag.ok { color: var(--ok-text); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 28%, transparent); }
.tag.warn { color: var(--warn-text); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.tag.bad { color: var(--bad-text); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 28%, transparent); }
.tag.review { color: var(--review-text); background: var(--review-soft); border-color: color-mix(in srgb, var(--review) 28%, transparent); }
.tag.subtle { color: var(--label-tertiary); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--label-caption); flex: none; display: inline-block; }
.status-dot.ok { background: var(--ok); }
.status-dot.warn { background: var(--warn); }
.status-dot.bad { background: var(--bad); }
.status-dot.review { background: var(--review); }
.status-dot.pulse { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 16%, transparent); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 12%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 18%, transparent); } }
.dotsep { width: 2px; height: 2px; border-radius: 50%; background: var(--label-caption); flex: none; }
.hint { color: var(--label-tertiary); font-size: 11.5px; line-height: 1.5; }
.section { margin-bottom: 14px; }
.section-head { display: flex; align-items: baseline; gap: 7px; min-height: 24px; margin-bottom: 6px; }
.section-head h3 { margin: 0; font-size: 12px; line-height: 18px; font-weight: 600; color: var(--label-primary); }
.section-head .count { font-size: 10.5px; color: var(--label-tertiary); font-variant-numeric: tabular-nums; }
.section-head .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }

/* ---------- right sidebar / dockkit chrome ---------- */
.rightbar {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--bg-base); border-left: .5px solid var(--border-l2);
  box-shadow: var(--shadow-panel); position: relative;
}
.resize-handle {
  position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; z-index: 8;
  cursor: col-resize; background: transparent; border: 0; padding: 0;
}
.resize-handle::after {
  content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 1px;
  background: var(--border-l2); opacity: .45; transition: background var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.resize-handle:hover::after, .resize-handle:focus-visible::after { background: var(--accent); opacity: 1; }
.app[data-w="full"] .resize-handle { display: none; }
body.is-resizing, body.is-resizing * { cursor: col-resize !important; user-select: none !important; }
.tabstrip {
  flex: none; height: 38px; padding: 10px 6px 0 10px; display: flex; align-items: center; gap: 4px;
  border-bottom: .5px solid var(--border-l1); position: relative;
}
.tabchips { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; flex: 0 1 auto; }
.tabchip {
  height: 26px; padding: 0 8px; border: .5px solid transparent; border-radius: 7px;
  background: transparent; color: var(--label-tertiary); font-size: 11px;
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none;
}
.tabchip:hover { background: var(--hover); color: var(--label-secondary); }
.tabchip.is-active { background: var(--bg-layer-3); border-color: var(--border-l2); color: var(--label-primary); }
.tabchip .tabbadge { min-width: 14px; height: 14px; padding: 0 3px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-text); font-size: 9.5px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tabchip .tabbadge.bad { background: var(--bad-soft); color: var(--bad-text); }
.tabfill { flex: 1 1 0; min-width: 0; }
.tabtools { display: flex; align-items: center; gap: 2px; flex: none; }
.tabtools .iconbtn { width: 24px; height: 24px; }
.tabstrip .pin { top: 1px; right: 1px; }
.drawer { flex: 1; min-height: 0; display: flex; flex-direction: column; container: drawer / inline-size; }
.drawer-head {
  flex: none; padding: 9px 14px 8px; border-bottom: .5px solid var(--border-l1);
  background: var(--bg-base); position: relative; z-index: 3;
}
.dh-row { display: flex; align-items: center; gap: 7px; min-height: 26px; }
.dh-title { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.dh-title h2 { margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dh-title .glyph { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.dh-tools { display: flex; align-items: center; gap: 2px; flex: none; }
.dh-scope { display: flex; align-items: center; gap: 8px; margin-top: 7px; min-height: 26px; }
.dh-note { margin-left: auto; color: var(--label-tertiary); font-size: 10.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; padding: 2px; background: var(--bg-layer-3); border-radius: 7px; gap: 1px; }
.seg button {
  height: 22px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent;
  color: var(--label-tertiary); font-size: 10.5px; white-space: nowrap;
}
.seg button:hover { color: var(--label-primary); }
.seg button.is-active { background: var(--bg-base); color: var(--label-primary); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 550; }
.drawer-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; }
.drawer-foot {
  flex: none; border-top: .5px solid var(--border-l2); padding: 8px 14px;
  display: flex; align-items: center; gap: 6px; background: var(--bg-base);
}
.drawer-foot .hint { flex: 1; min-width: 0; }
.summary {

/* =====================================================================
   数据派生
   ===================================================================== */
function sessionsForScenario() {
  if (state.scenario === 'empty' || state.scenario === 'error') return [];
  if (state.scenario === 'stress') {
    const all = BASE_SESSIONS.concat(STRESS_SESSIONS);
    return all.map(s => s.id === 's1' ? { ...s, agents: 6, totalAgents: 10, ledger: { delegated: 7, reviews: 1, newSessions: 0 } } : s);
  }
  if (state.scenario === 'partial') {
    return BASE_SESSIONS.map(s => (s.id === 's2' || s.id === 's7')
      ? { ...s, loaded: false, agents: null, totalAgents: null, attention: null }
      : s);
  }
  return BASE_SESSIONS;
}

function selectedSession() {
  const all = sessionsForScenario();
  return all.find(s => s.id === state.selectedSession) || (state.selectedSession === 's1' ? BASE_SESSIONS[0] : null);
}

function agentsFor(session) {
  if (!session || session.loaded === false) return [];
  if (session.id === 's1') return state.scenario === 'stress' ? AGENTS.concat(EXTRA_AGENTS) : AGENTS;
  const count = Math.max(0, Math.min(session.agents || 0, 6));
  return AGENTS.slice(0, count);
}

function rolesForScenario() {
  return state.scenario === 'stress' ? ROLES_BASE.concat(ROLES_EXTRA) : ROLES_BASE;
}

function candidatesForScenario() {
  return state.scenario === 'stress' ? CANDIDATES : CANDIDATES.slice(0, 3);
}

function channelsForScenario() {
  return state.scenario === 'stress' ? CHANNELS : CHANNELS.slice(0, 4);
}

function relativeTime(seconds) {
  if (seconds == null) return '—';
  if (seconds < 60) return seconds + 's';
  if (seconds < 3600) return Math.round(seconds / 60) + 'm';
  return Math.round(seconds / 3600) + 'h';
}

function sessionTone(s) {
  if (s.running) return 'ok';
  if (s.attention && s.attention.kind === 'approval') return 'warn';
  if (s.attention && s.attention.kind === 'failed') return 'bad';
  return 'idle';
}

function statusInfo(agent) {
  switch (agent.status) {
    case 'running': return { tone: 'ok', label: '运行中' };
    case 'waiting': return { tone: 'warn', label: '待复核' };
    case 'done': return { tone: 'ok', label: '已完成' };
    case 'failed': return { tone: 'bad', label: '失败' };
    case 'queued': return { tone: 'idle', label: '排队中' };
    default: return { tone: 'idle', label: '空闲' };
  }
}

function roleById(id) {
  return ROLES_BASE.concat(ROLES_EXTRA).find(r => r.id === id);
}

/* =====================================================================
   小组件
   ===================================================================== */
function tag(text, tone = '') {
  return `<span class="tag ${tone}">${esc(text)}</span>`;
}

function inlinePin(n) {
  if (!state.anno) return '';
  const a = ANNOTATIONS.find(x => x.n === n);
  return `<button class="pin inline" data-action="pin" data-note="${n}" title="A${n} · ${esc(a ? a.title : '')}" aria-label="标注 ${n}">${n}</button>`;
}

function switchControl(label, on, action = 'toggle-switch') {
  return `<button class="switch ${on ? 'on' : ''}" data-action="${action}" type="button" aria-pressed="${on ? 'true' : 'false'}"><span class="track" aria-hidden="true"></span><span>${esc(label)}</span></button>`;
}

function bars(pattern) {
  const count = 24;
  const out = [];
  for (let i = 0; i < count; i += 1) {
    let cls = 'ok';
    let h = 92 + ((i * 7) % 9);
    if (pattern === 'empty') { cls = 'empty'; h = 8; }
    if (pattern === 'oneWarn' && i === 15) { cls = 'warn'; h = 58; }
    if (pattern === 'twoWarn' && (i === 8 || i === 17)) { cls = 'warn'; h = 62; }
    if (pattern === 'twoBad' && (i === 6 || i === 18)) { cls = 'bad'; h = 38; }
    out.push(`<i class="${cls}" style="height:${h}%" title="第 ${i + 1} 桶"></i>`);
  }
  return out.join('');
}

/* =====================================================================
   右栏：全局
   ===================================================================== */
function globalMetrics(sessions) {
  const runningSessions = sessions.filter(s => s.running).length;
  const runningAgents = sessions.reduce((n, s) => n + (s.loaded === false ? 0 : (s.running ? (s.agents || 0) : 0)), 0);
  const pending = sessions.filter(s => s.attention).length;
  const abnormal = sessions.filter(s => s.attention && (s.attention.kind === 'failed' || s.attention.kind === 'review')).length;
  const unknown = sessions.filter(s => s.loaded === false).length;
  return { runningSessions, runningAgents, pending, abnormal, unknown };
}

function attentionRows(sessions) {
  const order = { approval: 0, question: 1, failed: 2, review: 3 };
  return sessions
    .filter(s => s.attention)
    .sort((a, b) => (order[a.attention.kind] ?? 9) - (order[b.attention.kind] ?? 9));
}

function renderAttention(sessions) {
  const all = attentionRows(sessions);
  if (!all.length) return '';
  const rows = all.slice(0, state.scenario === 'stress' ? 4 : 3);
  const more = all.length - rows.length;
  return `
    <section class="section">
      <div class="section-head"><h3>待你处理</h3><span class="count">${all.length}</span>${inlinePin(4)}<span class="right hint">按紧急度</span></div>
      <div class="attention">
        ${rows.map(s => {
          const kind = s.attention.kind;
          const tone = kind === 'approval' ? 'warn' : (kind === 'failed' ? 'bad' : (kind === 'review' ? 'warn' : 'warn'));
          return `<button class="att-row" data-action="session" data-id="${s.id}">
            <span class="att-icon ${tone}">${icon(kind === 'failed' ? 'alert' : (kind === 'approval' ? 'alert' : (kind === 'review' ? 'check' : 'info')), 12)}</span>
            <span class="att-main"><b>${esc(s.attention.title)}</b><em>${esc(s.attention.detail)}</em></span>
            <span class="att-time">${esc(s.attention.time)}</span>
          </button>`;
        }).join('')}
        ${more ? `<button class="att-row att-more" data-action="filter-attention">还有 ${more} 个待处理，查看全部</button>` : ''}
      </div>
    </section>`;
}

function renderGroup(g) {
  const running = g.sessions.filter(s => s.running).length;
  const rows = g.sessions.slice().sort((a, b) => (Number(b.running) - Number(a.running)) || (a.updated - b.updated));
  return `
    <section class="group">
      <div class="group-head">
        ${icon('chevronDown', 10)}${icon('folder', 11)}<b>${esc(g.name)}</b>
        ${g.path ? `<span class="gpath">${esc(g.path)}</span>` : ''}
        ${g.sessions.some(s => s.current) ? inlinePin(5) : ''}
        <span class="gcount">${running ? `${running} 运行 · ` : ''}${g.sessions.length} 会话</span>
      </div>
      ${rows.map(s => {
        const tone = sessionTone(s);
        const agentText = s.loaded === false ? '智能体未知' : (s.agents ? `${s.agents} 个${s.totalAgents && s.totalAgents > s.agents ? ` / ${s.totalAgents}` : ''}` : '无子智能体');
        return `
          <div class="srow ${s.current ? 'is-current' : ''}" data-action="session" data-id="${s.id}" role="button" tabindex="0">
            <span class="status-dot ${tone}"></span>
            <span class="srow-main">
              <span class="srow-title"><span class="t" title="${esc(s.title)}">${esc(s.title)}</span>${s.current ? tag('当前', 'accent') : ''}${s.unread ? tag('完成', 'ok') : ''}</span>
              <span class="srow-meta">
                <span class="m">${esc(s.model)}</span>
                <span class="dotsep optional"></span><span class="m optional">${esc(s.chain)}</span>
                <span class="dotsep"></span><span class="agent-count">${icon('bot', 9)} ${esc(agentText)}</span>
                ${s.loaded === false ? `<button class="load-link" data-action="load-projection" data-id="${s.id}">加载</button>` : ''}
              </span>
            </span>
            <span class="srow-side"><time>${relativeTime(s.updated)}</time><button class="iconbtn" title="打开会话" data-action="open-session" data-id="${s.id}">${icon('external', 12)}</button></span>
          </div>`;
      }).join('')}
    </section>`;
}

function renderGlobal() {
  const all = sessionsForScenario();
  const error = state.scenario === 'error';
  const empty = state.scenario === 'empty' || all.length === 0;
  const m = globalMetrics(all);
  const groups = WORKSPACES.map(w => ({ ...w, sessions: all.filter(s => s.ws === w.id) })).filter(g => g.sessions.length > 0);
  const filteredGroups = groups.map(g => ({
    ...g,
    sessions: g.sessions.filter(s => {
      if (state.filter === 'running' && !s.running) return false;
      if (state.filter === 'attention' && !s.attention) return false;
      if (state.filter === 'abnormal' && !(s.attention && (s.attention.kind === 'failed' || s.attention.kind === 'review'))) return false;
      if (state.query.trim()) {
        const q = state.query.trim().toLowerCase();
        const hay = `${s.title} ${s.model} ${s.chain} ${g.name}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }),
  })).filter(g => g.sessions.length > 0);

  return `
    <div class="drawer-scroll">
      <div class="global-col">
      ${state.anno ? `<div class="anno-label"><span>全局概览</span>${inlinePin(3)}</div>` : ''}
      <div class="summary">
        <div class="metric"><span class="k">运行中会话</span><span class="v">${error ? '—' : m.runningSessions}</span><span class="s">${error ? '读取失败' : `共 ${all.length} 个会话`}</span></div>
        <div class="metric"><span class="k">运行中智能体</span><span class="v">${error ? '—' : m.runningAgents}</span><span class="s">${error ? '读取失败' : (m.unknown ? `${m.unknown} 个会话未知` : '直接子智能体')}</span></div>
        <div class="metric"><span class="k">待你处理</span><span class="v ${!error && m.pending ? 'warn' : ''}">${error ? '—' : m.pending}</span><span class="s">${error ? '读取失败' : '审批 / 提问 / 复核'}</span></div>
        <div class="metric"><span class="k">异常</span><span class="v ${!error && m.abnormal ? 'bad' : ''}">${error ? '—' : m.abnormal}</span><span class="s">${error ? '读取失败' : '失败 / 复核缺口'}</span></div>
      </div>
      ${!error && !empty ? `<div class="searchrow">
        <label class="searchbox">${icon('search', 12)}<input id="fleetSearch" type="search" placeholder="搜索会话、工作区或角色" value="${esc(state.query)}" aria-label="搜索会话"></label>
        <select class="filter-select" id="fleetFilter" aria-label="筛选会话">
          <option value="all" ${state.filter === 'all' ? 'selected' : ''}>全部</option>
          <option value="running" ${state.filter === 'running' ? 'selected' : ''}>运行中</option>
          <option value="attention" ${state.filter === 'attention' ? 'selected' : ''}>待处理</option>
          <option value="abnormal" ${state.filter === 'abnormal' ? 'selected' : ''}>异常</option>
        </select>
      </div>` : ''}
      ${error ? `
        <div class="error-state">
          <b>会话列表读取失败</b>
          <p><span class="mono">remote.session.list</span> 返回 <span class="mono">transport/closed</span>。本次读取失败不画成 0，也不伪装成空列表；重试成功后恢复。</p>
          <button class="btn sm" data-action="retry">${icon('refresh', 12)} 重试</button>
        </div>` : ''}
      ${!error && empty ? `
        <div class="empty-state">
          <span class="es-icon">${icon('bot', 18)}</span>
          <b>还没有可显示的会话</b>
          <p>DSH 里没有正在运行的会话，或宿主尚未返回会话列表。抽屉不会用空图表冒充“全部正常”。</p>
        </div>` : ''}
      ${!error && !empty ? renderAttention(all) : ''}
      ${!error && !empty && filteredGroups.length === 0 ? `
        <div class="empty-state"><span class="es-icon">${icon('search', 18)}</span><b>没有匹配的会话</b><p>清掉搜索词或把筛选切回“全部”。</p></div>` : ''}
      ${!error && !empty ? filteredGroups.map(renderGroup).join('') : ''}
      ${!error && !empty ? `
        <div class="scope-note">
          ${inlinePin(6)}
          <span>${icon('info', 11)}</span>
          <span class="grow">已加载最近 ${all.filter(s => s.loaded !== false).length} 个会话的子智能体状态${m.unknown ? `；${m.unknown} 个会话尚未加载，显示为“未知”` : ''}。打开会话或点刷新按需读取。</span>
          <button class="btn ghost sm" data-action="retry">刷新</button>
        </div>` : ''}
      </div>
    </div>`;
}

/* =====================================================================
   右栏：单会话
   ===================================================================== */
function renderTopology(agents) {
  const shown = agents.slice(0, 8);
  const more = agents.length - shown.length;
  const running = agents.filter(a => a.status === 'running').length;
  const reviews = agents.filter(a => a.role === 'review').length;
  const failed = agents.filter(a => a.status === 'failed').length;
  return `
    <div class="topology">
      <div class="topo-root">
        <span class="avatar c0">M</span>
        <span class="tr-main"><b>主会话 · ${esc((currentSessionForMain() || {}).model || 'DeepSeek-V4')}</b><em>第 4 轮 · 直接子智能体 ${agents.length} 个</em></span>
        ${tag('运行中', 'ok')}
      </div>
      <div class="topo-rail"></div>
      <div class="topo-children">
        ${shown.map(a => {
          const info = statusInfo(a);
          const cls = a.status === 'running' ? 'running' : (a.status === 'failed' ? 'failed' : (a.role === 'review' && a.status === 'waiting' ? 'review' : (a.status === 'done' ? 'done' : (a.status === 'queued' ? 'queued' : ''))));
          return `<button class="topo-node ${cls}" data-action="scroll-agent" data-id="${a.id}" title="${esc(a.roleId)} · ${info.label}" aria-label="${esc(a.roleId)}，${info.label}">${a.initial}${a.status === 'running' ? '<i class="flowdot"></i>' : ''}</button>`;
        }).join('')}
        ${more > 0 ? `<button class="topo-more" data-action="toast" data-message="还有 ${more} 个智能体，已折叠">+${more}</button>` : ''}
      </div>
      <div class="topo-summary"><span><b>${running}</b> 运行</span><span><b>${reviews}</b> 复核</span><span><b>${failed}</b> 失败</span></div>
      <div class="topo-legend"><span class="status-dot ok"></span>运行 <span class="status-dot warn"></span>待复核 <span class="status-dot bad"></span>失败 <span class="status-dot"></span>完成 / 空闲</div>
    </div>`;
}

function renderAgentCard(a) {
  const info = statusInfo(a);
  const role = roleById(a.roleId) || {};
  const cls = a.status === 'failed' ? 'failed' : (a.role === 'review' ? 'review' : (a.status === 'queued' ? 'queued' : (a.status === 'running' ? 'running' : 'done')));
  return `
    <article class="agent-card ${cls}" id="agent-${a.id}" data-action="open-agent" data-id="${a.id}" role="button" tabindex="0">
      <div class="agent-head">
        <span class="avatar ${a.cls}">${a.initial}</span>
        <span class="agent-name" title="${esc(a.roleId)}">${esc(a.roleId)}</span>
        <span class="agent-role">${a.role === 'review' ? tag('复核', 'review') : tag('工作', 'subtle')}</span>
        <span class="status-dot ${info.tone}" style="margin-left:auto"></span>
      </div>
      <div class="agent-task">${esc(a.task)}</div>
      ${a.status === 'failed' ? `<div class="agent-error">RATE_LIMIT · 已消耗 1 次派发预算</div>` : ''}
      <div class="agent-foot">
        <span class="model">${esc(a.model)}</span><span class="sep"></span><span>${esc(a.elapsed)}</span>
        <span class="budget-pill" title="本角色自最近一条用户消息以来已派发 / 上限">${esc(a.budget)}</span>
      </div>
      <div class="progress" aria-hidden="true"><i style="width:${a.progress}%"></i></div>
    </article>`;
}

function renderFeed() {
  const rows = [
    { t: '13:42', tone: 'ok', title: '派发 coder-expert', sub: '第 4 轮 · 注入 goal / todos / stats' },
    { t: '13:41', tone: 'warn', title: '复核 security-auditor：有缺口', sub: '2 项 · 缺少 344px 实测截图' },
    { t: '13:39', tone: 'ok', title: '结算 code-reviewer：通过', sub: '4m12s · 结构化结论 verdict=done' },
    { t: '13:38', tone: 'bad', title: 'researcher 失败：RATE_LIMIT', sub: '第 4 轮 · 已消耗 1 次派发预算' },
    { t: '13:34', tone: 'ok', title: '用户发言：预算重置', sub: '派发 / 复核 / 新会话三本账归零' },
    { t: '13:32', tone: 'warn', title: '收工回执 needs_user', sub: '等待人拍板 · 附 3 项缺口' },
  ];
  if (state.scenario === 'stress') {
    rows.unshift({ t: '13:44', tone: 'ok', title: '派发 perf-tester', sub: '第 4 轮 · 22 会话压测' });

  return rows.map(r => `<div class="feed-row ${r.tone}"><time class="ft">${r.t}</time><div class="fc"><b>${esc(r.title)}</b><em>${esc(r.sub)}</em></div></div>`).join('');
}

function renderSessionDetail(session) {
  const agents = agentsFor(session);
  const loaded = session.loaded !== false;
  const firstRunning = agents.find(a => a.status === 'running') || agents[0];
  const total = session.totalAgents || agents.length;
  const ledger = session.ledger || {
    delegated: Math.min(8, agents.length),
    reviews: agents.some(a => a.role === 'review') ? 1 : 0,
    newSessions: 0,
  };
  const delegated = ledger.delegated;
  const reviewUsed = ledger.reviews;
  return `
    <div class="drawer-scroll">
      <div class="session-head">
        <div class="session-title-line"><h2 title="${esc(session.title)}">${esc(session.title)}</h2>${session.running ? tag('运行中', 'ok') : tag('空闲', '')}</div>
        <div class="session-meta">
          <span>${esc((WORKSPACES.find(w => w.id === session.ws) || {}).name || '')}</span><span class="dotsep"></span>
          <span>${esc(session.model)}</span><span class="dotsep"></span><span>${esc(session.chain)}</span><span class="dotsep"></span>
          <span class="mono">${esc(session.id)}</span>
        </div>
      </div>
      ${!loaded ? `
        <div class="scope-note"><span>${icon('info', 11)}</span><span class="grow">该会话的智能体投影尚未加载。下面只显示会话级事实，不把未知写成 0。</span><button class="btn ghost sm" data-action="load-projection">加载</button></div>` : ''}
      <div class="statusline">
        <span class="status-dot ${session.running ? 'ok pulse' : ''}"></span><span>${session.running ? `运行中 · 第 4 轮` : '当前无运行回合'}</span>
        ${session.reviewGap ? tag('复核有缺口', 'warn') : ''}
        <span class="push"></span><span class="mono">${esc(session.tokens || '—')} tokens</span>
      </div>
      ${loaded ? `
      ${state.anno ? `<div class="anno-label"><span>三本预算</span>${inlinePin(7)}</div>` : ''}
      <div class="budget">
        <div class="b"><span class="k">派发</span><span class="v">${delegated} <small>/ 8</small></span><div class="track"><i style="width:${Math.round(delegated / 8 * 100)}%"></i></div></div>
        <div class="b"><span class="k">复核</span><span class="v">${reviewUsed} <small>/ 1</small></span><div class="track"><i style="width:${Math.min(100, reviewUsed / 1 * 100)}%;background:var(--warn)"></i></div></div>
        <div class="b"><span class="k">开新会话</span><span class="v">${ledger.newSessions || 0} <small>/ 2</small></span><div class="track"><i style="width:${Math.min(100, (ledger.newSessions || 0) / 2 * 100)}%"></i></div></div>
      </div>
      <div class="budget-note">用户发言后重置；接力不重置。上限不是配额，复核第一次通过即可收工。</div>
      ` : ''}
      ${loaded && agents.length ? `<div class="section-head"><h3>智能体拓扑</h3><span class="count">${agents.length} 个直接子节点</span>${inlinePin(8)}</div>` : ''}
      ${loaded && agents.length ? renderTopology(agents) : ''}
      ${loaded && !agents.length ? `
        <div class="empty-state"><span class="es-icon">${icon('bot', 18)}</span><b>本会话还没有派发子智能体</b><p>主模型调用 handoff 的 delegate 动作后会出现在这里；没有子智能体不是错误。</p></div>` : ''}
      ${loaded && agents.length ? `
        <div class="content-grid">
          <div>
            <div class="section-head"><h3>智能体</h3><span class="count">${agents.length}${total > agents.length ? ` / ${total}` : ''}</span>${inlinePin(9)}<span class="right hint">按状态排序</span></div>
            <div class="agent-grid">${agents.map(renderAgentCard).join('')}</div>
          </div>
          <aside class="feed">
            <div class="section-head"><h3>最近活动</h3>${inlinePin(10)}<span class="right"><button class="btn ghost sm" data-action="toast" data-message="活动筛选：异常（原型）">异常</button></span></div>
            <div class="feed-list">${renderFeed()}</div>
          </aside>
        </div>` : ''}
    </div>
    <div class="drawer-foot">
      <span class="hint">${loaded ? `${agents.filter(a => a.status === 'running').length} 个运行中 · 实时同步` : '投影未加载'}</span>
      <button class="btn ghost sm" data-action="copy-id" data-id="${session.id}">复制 ID</button>
      <button class="btn sm" data-action="open-agent" data-id="${firstRunning ? firstRunning.id : ''}">${icon('external', 12)} 子会话</button>
      <button class="btn primary sm" data-action="open-main" data-id="${session.id}">打开主会话</button>
    </div>`;
}

          <div class="dh-tools">
            <button class="iconbtn" title="刷新" data-action="retry">${icon('refresh', 13)}</button>
            <button class="iconbtn" title="更多" data-action="toast" data-message="更多操作（原型）">${icon('more', 13)}</button>
          </div>
        </div>
        <div class="dh-scope">
          <div class="seg" role="tablist" aria-label="视图范围">
            <button class="${scope === 'global' ? 'is-active' : ''}" data-action="scope" data-value="global" role="tab" aria-selected="${scope === 'global'}">全局</button>
            <button class="${scope === 'session' ? 'is-active' : ''}" data-action="scope" data-value="session" role="tab" aria-selected="${scope === 'session'}">本会话</button>

        </div>
      </div>
      ${inDetail ? renderSessionDetail(session) : renderGlobal()}

}

        ${channels.map(c => `
          <div class="health-row">
            <div class="health-top">
              <div class="health-main">
                <span class="status-dot ${c.ok == null ? '' : (c.ok >= 99 ? 'ok' : (c.ok >= 95 ? 'warn' : 'bad'))}"></span>
                <span class="health-name">${esc(c.name)}</span>
                ${c.ok == null ? tag('未观测', 'subtle') : tag(`${c.ok}%`, c.ok >= 99 ? 'ok' : (c.ok >= 95 ? 'warn' : 'bad'))}
              </div>
              <button class="btn ghost sm" data-action="toast" data-message="探活 ${esc(c.name)}">探活</button>
            </div>
            <div class="health-meta"><span>${c.calls} 次调用</span><span>步内延迟 ${c.latency}</span><span>吞吐 ${c.tps}</span><span>${esc(c.note)}</span></div>
            <div class="bars" title="最近 24 个桶的成功率；空槽代表无观测">${bars(c.bars)}</div>
          </div>`).join('')}
      </div>
      <div class="scope-note" style="margin-top:10px;">${icon('info', 11)}<span class="grow">柱高是桶内成功率，不是延迟；没有样本的桶画成空槽。TTFT 属于 DSH 的 sessionStats，不由本插件采集。</span></div>
    </div>`;
}

function renderConsole() {
  const tab = state.consoleTab;
  const roleCount = rolesForScenario().length;
  const channelCount = channelsForScenario().length;
  maincol.innerHTML = `
    <div class="console">
      <div class="page-head">
        <div class="page-head-main">
          <div class="page-kicker">DSH On-call</div>
          <h1 class="page-title">模型路由与委派</h1>
          <p class="page-sub">为 Agent 主请求提供跨 provider 故障转移，给子智能体一张可复用的名册。配置与运行分开：配置在这里，实时协同在右栏。</p>
        </div>
        <div class="page-head-actions">
          ${tag('接管中', 'ok')}
          <button class="btn sm" data-action="toast" data-message="更新日志（原型）">更新日志</button>
          <button class="btn sm" data-action="toast" data-message="故障转移历史（原型）">历史</button>
          ${switchControl('接管路由', true)}
        </div>
      </div>
      <div class="page-tabs">
        <div class="seg" role="tablist" aria-label="配置视图">
          <button class="${tab === 'chain' ? 'is-active' : ''}" data-action="console-tab" data-value="chain" role="tab" aria-selected="${tab === 'chain'}">路由链 <span class="n">${state.scenario === 'stress' ? '5 候选' : '3 候选'}</span></button>
          <button class="${tab === 'roster' ? 'is-active' : ''}" data-action="console-tab" data-value="roster" role="tab" aria-selected="${tab === 'roster'}">委派名册 <span class="n">${roleCount} 岗位</span></button>
          <button class="${tab === 'health' ? 'is-active' : ''}" data-action="console-tab" data-value="health" role="tab" aria-selected="${tab === 'health'}">渠道健康 <span class="n">${channelCount} 渠道</span></button>
        </div>
        ${inlinePin(11)}
      </div>
      <div class="page-scroll">
        ${tab === 'chain' ? renderChainView() : (tab === 'roster' ? renderRosterView() : renderHealthView())}
      </div>
      <div class="page-footer">
        <span class="status"><b>所有修改已保存</b> · Ctrl+S 保存 · 保存后 Cordis 重启插件 fiber</span>
        ${inlinePin(14)}
        <button class="btn sm" data-action="toast" data-message="没有可放弃的修改">放弃</button>
        <button class="btn primary sm" data-action="toast" data-message="保存配置（原型）">保存</button>
      </div>
    </div>`;
}

/* =====================================================================
   渲染入口与交互
   ===================================================================== */
function renderLegend() {
  const noChrome = document.body.classList.contains('no-chrome');
  const legendH = state.anno ? (window.innerWidth < 1000 ? 140 : (window.innerWidth < 1200 ? 116 : 92)) : 0;
  legend.style.height = legendH + 'px';
  if (!state.anno) {
    legend.classList.remove('is-open');
    legend.innerHTML = '';
    stage.style.height = noChrome ? '100vh' : 'calc(100vh - 46px)';
    app.style.height = noChrome ? '100vh' : 'calc(100vh - 74px)';
    return;
  }
  legend.classList.add('is-open');
  legend.innerHTML = ANNOTATIONS.map(a => `<div class="legend-item"><span class="n">${a.n}</span><span><b>${esc(a.title)}</b> · ${esc(a.text)}</span></div>`).join('');
  stage.style.height = noChrome ? `calc(100vh - ${legendH}px)` : `calc(100vh - ${46 + legendH}px)`;
  app.style.height = noChrome ? `calc(100vh - ${legendH}px)` : `calc(100vh - ${74 + legendH}px)`;
}

function syncDemo() {
  document.querySelectorAll('[data-group]').forEach(group => {
    const key = group.getAttribute('data-group');
    group.querySelectorAll('[data-action]').forEach(button => {
      const action = button.getAttribute('data-action');
      let current = null;
      if (action === 'screen') current = state.screen;
      if (action === 'theme') current = state.theme;
      if (action === 'scenario') current = state.scenario;
      if (action === 'width') current = state.width;
      if (action === 'anno') current = state.anno ? 'on' : 'off';
      if (current != null) {
        button.classList.toggle('is-active', action === 'anno' ? state.anno : button.getAttribute('data-value') === current);
        if (action === 'anno') button.textContent = state.anno ? '标注 开' : '标注 关';
      }
    });
  });
}

function render() {
  document.documentElement.setAttribute('data-theme', state.theme);
  app.setAttribute('data-w', state.width);
  app.setAttribute('data-screen', state.screen);
  if (state.rightWidth && state.screen === 'drawer' && state.width !== 'full') {
    app.style.setProperty('--right-w', state.rightWidth + 'px');
  } else {
    app.style.removeProperty('--right-w');
  }
  renderLeft();
  if (state.screen === 'console') {
    renderConsole();
    rightbar.innerHTML = '';
  } else {
    renderConversation();
    renderRight();
  }
  renderLegend();
  syncDemo();
}

function toast(message) {
  toastEl.textContent = message;
  toastEl.hidden = false;
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2400);
}

function openSession(id) {
  const all = sessionsForScenario();
  const session = all.find(s => s.id === id);
  if (!session) { toast('该会话不在当前列表'); return; }
  state.selectedSession = id;
  state.drawerScope = 'session';
  renderRight();
}

function scrollAgent(id) {
  const el = document.getElementById('agent-' + id);
  if (el) {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.style.outline = '2px solid var(--accent)';
    setTimeout(() => { el.style.outline = ''; }, 1200);
  }
}

document.addEventListener('click', event => {
  const popover = document.getElementById('chipRetryPopover');
  if (popover && !popover.hidden && !event.target.closest('.composer')) {
    popover.hidden = true;
  }
  const pinEl = event.target.closest('[data-action="pin"]');
  if (pinEl) {
    const n = Number(pinEl.getAttribute('data-note'));
    const a = ANNOTATIONS.find(x => x.n === n);
    if (a) toast(`A${n} · ${a.title}：${a.text}`);
    return;
  }
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.getAttribute('data-action');
  const value = actionEl.getAttribute('data-value');
  if (action === 'screen') { state.screen = value; state.selectedSession = null; state.drawerScope = 'global'; render(); return; }
  if (action === 'theme') { state.theme = value; render(); return; }
  if (action === 'scenario') {
    state.scenario = value;
    state.selectedSession = null;
    state.drawerScope = 'global';
    state.query = '';
    state.filter = 'all';
    render();
    return;
  }
  if (action === 'width') { state.rightWidth = null; state.width = value; render(); return; }
  if (action === 'anno') { state.anno = !state.anno; render(); return; }
  if (action === 'toggle-switch') {
    actionEl.classList.toggle('on');
    actionEl.setAttribute('aria-pressed', actionEl.classList.contains('on') ? 'true' : 'false');
    return;
  }
  if (action === 'chip-retry') {
    const popover = document.getElementById('chipRetryPopover');
    if (popover) {
      popover.hidden = !popover.hidden;
      document.querySelector('[data-action="chip-retry"].c-chip')?.setAttribute('aria-expanded', String(!popover.hidden));
    }
    return;
  }
  if (action === 'console-tab') { state.consoleTab = value; render(); return; }
  if (action === 'roster') {
    state.rosterId = actionEl.getAttribute('data-id');
    render();
    const list = document.querySelector('.roster-list');
    const active = list && list.querySelector('.roster-item.is-active');
    if (list && active) list.scrollTop = Math.max(0, active.offsetTop - 6);
    return;
  }
  if (action === 'scope') {
    if (value === 'global') { state.selectedSession = null; state.drawerScope = 'global'; }
    else {
      if (!state.selectedSession) {
        const s = sessionsForScenario()[0];
        if (!s) { toast('当前没有会话'); return; }
        state.selectedSession = s.id;
      }
      state.drawerScope = 'session';
    }
    renderRight();
    return;
  }
  if (action === 'back') { state.selectedSession = null; state.drawerScope = 'global'; renderRight(); return; }
  if (action === 'session') { openSession(actionEl.getAttribute('data-id')); return; }
  if (action === 'open-session' || action === 'open-main') {
    event.stopPropagation();
    toast(`调用 ctx.uiWorkspace.openSession(${actionEl.getAttribute('data-id')})`);
    return;
  }
  if (action === 'open-agent') {
    const id = actionEl.getAttribute('data-id');
    toast(id ? `在右栏打开子会话 ${id}` : '先选择一个子智能体');
    return;
  }
  if (action === 'scroll-agent') { scrollAgent(actionEl.getAttribute('data-id')); return; }
  if (action === 'copy-id') { toast(`已复制 ${actionEl.getAttribute('data-id')}`); return; }
  if (action === 'open-drawer') {
    if (state.screen !== 'drawer') { state.screen = 'drawer'; render(); }
    state.selectedSession = null;
    state.drawerScope = 'global';
    renderRight();
    return;
  }
  if (action === 'retry') {
    toast('刷新会话列表与投影…');
    setTimeout(() => { toast('已刷新'); }, 700);
    return;
  }
  if (action === 'filter-attention') {
    state.filter = 'attention';
    renderRight();
    toast('已筛选：待处理');
    return;
  }
  if (action === 'load-projection') { toast('按需读取该会话的 subagentCatalog / subagentTiming'); return; }
  if (action === 'toast') { toast(actionEl.getAttribute('data-message') || ''); return; }
});

let rightDrag = null;
document.addEventListener('pointerdown', event => {
  const handle = event.target.closest('#rightResizeHandle');
  if (!handle || state.screen !== 'drawer' || state.width === 'full') return;
  const appRect = app.getBoundingClientRect();
  const leftWidth = parseFloat(getComputedStyle(app).getPropertyValue('--left-w')) || 280;
  const max = Math.min(appRect.width * 0.7, appRect.width - leftWidth - 400);
  if (max < 300) { toast('当前视口没有足够的停靠空间，可收起左栏或全屏'); return; }
  event.preventDefault();
  rightDrag = { startX: event.clientX, startW: rightbar.getBoundingClientRect().width, max };
  document.body.classList.add('is-resizing');
  handle.setPointerCapture?.(event.pointerId);
});
document.addEventListener('pointermove', event => {
  if (!rightDrag) return;
  const width = Math.round(Math.min(rightDrag.max, Math.max(300, rightDrag.startW - (event.clientX - rightDrag.startX))));
  state.rightWidth = width;
  app.style.setProperty('--right-w', width + 'px');
});
document.addEventListener('pointerup', () => {
  if (!rightDrag) return;
  document.body.classList.remove('is-resizing');
  rightDrag = null;
  toast(`右栏宽度 ${state.rightWidth}px · 等价 DSH 原生拖动`);
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    const popover = document.getElementById('chipRetryPopover');
    if (popover && !popover.hidden) { popover.hidden = true; return; }
    if (state.selectedSession) { state.selectedSession = null; state.drawerScope = 'global'; renderRight(); }
    return;
  }
  if (event.target.id === 'rightResizeHandle' && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
    event.preventDefault();
    const appRect = app.getBoundingClientRect();
    const leftWidth = parseFloat(getComputedStyle(app).getPropertyValue('--left-w')) || 280;
    const max = Math.min(appRect.width * 0.7, appRect.width - leftWidth - 400);
    const current = rightbar.getBoundingClientRect().width;
    const next = Math.round(Math.min(max, Math.max(300, current + (event.key === 'ArrowRight' ? -20 : 20))));
    state.rightWidth = next;
    app.style.setProperty('--right-w', next + 'px');
    return;
  }
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-action="session"]')) {
    event.preventDefault();
    openSession(event.target.getAttribute('data-id'));
  }
});

document.addEventListener('input', event => {
  if (event.target.id === 'fleetSearch') {
    state.query = event.target.value;
    renderRight();
    const input = document.getElementById('fleetSearch');
    if (input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
});

document.addEventListener('change', event => {
  if (event.target.id === 'fleetFilter') {
    state.filter = event.target.value;
    renderRight();
  }
});

// Reproducible captures: every screenshot in the design doc can be re-shot from a URL.
// e.g. ?screen=drawer&scenario=stress&theme=dark&width=1440&session=s1&anno=1
const params = new URLSearchParams(location.search);
const pick = (key, allowed, apply) => {
  const value = params.get(key);
  if (value != null && allowed.includes(value)) apply(value);
};
pick('screen', ['drawer', 'console'], v => { state.screen = v; });
pick('theme', ['light', 'dark'], v => { state.theme = v; });
pick('scenario', ['normal', 'stress', 'partial', 'empty', 'error'], v => { state.scenario = v; });
pick('width', ['1440', '1280', '1024', '900', '800', 'full'], v => { state.width = v; });
pick('tab', ['chain', 'roster', 'health'], v => { state.consoleTab = v; });
pick('scope', ['global', 'session'], v => { state.drawerScope = v; });
if (params.get('anno') === '0') state.anno = false;
if (params.get('chrome') === '0') document.body.classList.add('no-chrome');
const sessionParam = params.get('session');
if (sessionParam) {
  state.selectedSession = sessionParam;
  state.drawerScope = 'session';
}
const rosterParam = params.get('roster');
if (rosterParam) state.rosterId = rosterParam;
const rightParam = params.get('right');
if (rightParam && /^\d+$/.test(rightParam)) state.rightWidth = Math.max(300, Number(rightParam));

render();

requestAnimationFrame(() => {
  const list = document.querySelector('.roster-list');
  const active = list && list.querySelector('.roster-item.is-active');
  if (list && active) list.scrollTop = Math.max(0, active.offsetTop - 6);
  if (params.get('popover') === '1') {
    const popover = document.getElementById('chipRetryPopover');
    if (popover) popover.hidden = false;
  }
  if (params.get('scroll') === 'bottom') {
    const scroller = document.querySelector('.page-scroll') || document.querySelector('.drawer-scroll');
    if (scroller) scroller.scrollTop = scroller.scrollHeight;
  }
});
</script>
